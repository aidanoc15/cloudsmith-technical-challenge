name: Cloudsmith Artifact Consumption Demo

on:
  push:
  workflow_dispatch:

jobs:
  cloudsmith-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Cloudsmith Docker registry
        uses: docker/login-action@v3
        with:
          registry: docker.cloudsmith.io
          username: ${{ secrets.CLOUDSMITH_DOCKER_USERNAME }}
          password: ${{ secrets.CLOUDSMITH_TOKEN }}

      - name: Pull Python image through Cloudsmith
        run: |
          docker pull \
            docker.cloudsmith.io/aidanoc15/test/python:3.12-slim

      - name: Run Python application
        env:
          CLOUDSMITH_PYPI_URL: ${{ secrets.CLOUDSMITH_PYPI_URL }}
        run: |
          docker run --rm \
            -e PIP_INDEX_URL="$CLOUDSMITH_PYPI_URL" \
            -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
            -v "$PWD:/app:ro" \
            -w /app \
            docker.cloudsmith.io/aidanoc15/test/python:3.12-slim \
            sh -c '
              python -m pip install \
                --no-cache-dir \
                --no-input \
                --quiet \
                -r requirements.txt &&
              python app.py
            '
